spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
      - com.baomidou.mybatisplus.autoconfigure.MybatisPlusAutoConfiguration
  flyway:
    enabled: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

recruit:
  ai:
    enabled: ${AI_ENABLED:false}
    base-url: ${AI_BASE_URL:https://api.deepseek.com/chat/completions}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:deepseek-v4-flash}
    timeout-seconds: 30
  security:
    enabled: false
    jwt-secret: recruit-agent-local-development-secret-please-change
    jwt-expires-in-seconds: 7200
    refresh-token-expires-in-seconds: 604800
  storage:
    local-root: ./data/resumes
  ocr:
    enabled: ${OCR_ENABLED:false}
    command: ${OCR_COMMAND:tesseract}
    language: ${OCR_LANGUAGE:chi_sim+eng}
  vector-datasource:
    url: ${VECTOR_DB_URL:jdbc:postgresql://localhost:5432/recruit_vector}
    username: ${VECTOR_DB_USERNAME:recruit}
    password: ${VECTOR_DB_PASSWORD:recruit}
    driver-class-name: org.postgresql.Driver
  embedding:
    enabled: ${EMBEDDING_ENABLED:false}
    base-url: ${EMBEDDING_BASE_URL:}
    api-key: ${EMBEDDING_API_KEY:}
    model: ${EMBEDDING_MODEL:text-embedding-3-small}
    dimensions: 1536
  knowledge:
    chunk-size: ${KNOWLEDGE_CHUNK_SIZE:800}
    overlap: ${KNOWLEDGE_CHUNK_OVERLAP:100}
    min-score: ${KNOWLEDGE_MIN_SCORE:35}
  screening:
    default-weights:
      skill: 0.40
      project: 0.25
      experience: 0.15
      education: 0.10
      bonus: 0.10
