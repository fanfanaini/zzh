spring:
  application:
    name: recruit-agent
  config:
    import:
      - optional:file:${RECRUIT_ENV_FILE:.env}[.properties]
      - optional:file:../.env[.properties]
  profiles:
    active: local
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:recruit}
    password: ${RABBITMQ_PASSWORD:recruit}
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8080

recruit:
  conversation:
    memory:
      token-budget: ${CONVERSATION_MEMORY_TOKEN_BUDGET:2000}
      recent-message-limit: ${CONVERSATION_MEMORY_RECENT_LIMIT:12}
      retry-token-budget: ${CONVERSATION_MEMORY_RETRY_TOKEN_BUDGET:1000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}
