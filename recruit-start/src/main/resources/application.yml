spring:
  application:
    name: recruit-agent
  config:
    import:
      - optional:file:${RECRUIT_ENV_FILE:.env}[.properties]
      - optional:file:../.env[.properties]
  profiles:
    active: local
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:recruit}
    password: ${RABBITMQ_PASSWORD:recruit}
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8080

recruit:
  ai:
    recovery:
      max-attempts: ${AI_RECOVERY_MAX_ATTEMPTS:3}
      initial-backoff: ${AI_RECOVERY_INITIAL_BACKOFF:200ms}
      maximum-backoff: ${AI_RECOVERY_MAXIMUM_BACKOFF:2s}
  tool:
    idempotency:
      result-ttl: ${TOOL_IDEMPOTENCY_RESULT_TTL:24h}
      claim-ttl: ${TOOL_IDEMPOTENCY_CLAIM_TTL:30s}
      poll-interval: ${TOOL_IDEMPOTENCY_POLL_INTERVAL:25ms}
  retrieval:
    bm25:
      k1: ${BM25_K1:1.2}
      b: ${BM25_B:0.75}
    reranker:
      mode: ${RERANKER_MODE:heuristic}
      rrf-weight: ${RERANKER_RRF_WEIGHT:0.35}
      dense-weight: ${RERANKER_DENSE_WEIGHT:0.20}
      sparse-weight: ${RERANKER_SPARSE_WEIGHT:0.20}
      content-coverage-weight: ${RERANKER_CONTENT_WEIGHT:0.20}
      source-coverage-weight: ${RERANKER_SOURCE_WEIGHT:0.05}
      endpoint: ${RERANKER_HTTP_ENDPOINT:}
      api-key: ${RERANKER_HTTP_API_KEY:}
      model: ${RERANKER_HTTP_MODEL:jina-reranker-v2-base-multilingual}
      timeout: ${RERANKER_HTTP_TIMEOUT:5s}
      max-document-chars: ${RERANKER_HTTP_MAX_DOCUMENT_CHARS:4000}
  conversation:
    memory:
      token-budget: ${CONVERSATION_MEMORY_TOKEN_BUDGET:2000}
      recent-message-limit: ${CONVERSATION_MEMORY_RECENT_LIMIT:12}
      retry-token-budget: ${CONVERSATION_MEMORY_RETRY_TOKEN_BUDGET:1000}
  knowledge:
    multi-query-enabled: ${KNOWLEDGE_MULTI_QUERY_ENABLED:true}
    multi-query-max-queries: ${KNOWLEDGE_MULTI_QUERY_MAX_QUERIES:4}
    multi-query-candidate-multiplier: ${KNOWLEDGE_MULTI_QUERY_CANDIDATE_MULTIPLIER:3}
  skills:
    enabled: ${SKILLS_ENABLED:true}
    match-limit: ${SKILLS_MATCH_LIMIT:3}
    max-prompt-chars: ${SKILLS_MAX_PROMPT_CHARS:6000}
    min-score: ${SKILLS_MIN_SCORE:20}
  ops:
    recent-limit: ${OPS_RECENT_LIMIT:200}
    model-failure-rate-warn: ${OPS_MODEL_FAILURE_RATE_WARN:0.20}
    model-failure-rate-critical: ${OPS_MODEL_FAILURE_RATE_CRITICAL:0.40}
    model-latency-warn-millis: ${OPS_MODEL_LATENCY_WARN_MILLIS:4000}
    model-latency-critical-millis: ${OPS_MODEL_LATENCY_CRITICAL_MILLIS:8000}
    trace-failure-rate-warn: ${OPS_TRACE_FAILURE_RATE_WARN:0.15}
    trace-failure-rate-critical: ${OPS_TRACE_FAILURE_RATE_CRITICAL:0.30}
    no-model-call-warn-after: ${OPS_NO_MODEL_CALL_WARN_AFTER:24h}
    alert-scheduler-enabled: ${OPS_ALERT_SCHEDULER_ENABLED:true}
    alert-evaluation-interval-ms: ${OPS_ALERT_EVALUATION_INTERVAL_MS:60000}
    alert-notification-enabled: ${OPS_ALERT_NOTIFICATION_ENABLED:false}
    alert-webhook-url: ${OPS_ALERT_WEBHOOK_URL:}
    alert-notification-cooldown: ${OPS_ALERT_NOTIFICATION_COOLDOWN:10m}
    alert-notification-retry-delay: ${OPS_ALERT_NOTIFICATION_RETRY_DELAY:1m}
    alert-notification-max-attempts: ${OPS_ALERT_NOTIFICATION_MAX_ATTEMPTS:5}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}
